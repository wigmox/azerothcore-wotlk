# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: ubuntu-build-playerbot

on:
  push:
    branches: [ "Playerbot" ]
  pull_request:
    branches: [ "Playerbot" ]

jobs:
  build:
    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false
      matrix:
        # the result of the matrix will be the combination of all attributes, so we get os*compiler builds
        include:
          - os: ubuntu-24.04-arm
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Release

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}-${{ matrix.cpp_compiler }}

    steps:
    - name: Checkout AzerothCore
      uses: actions/checkout@v4

    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        # 强制创建 /home/azerothcore-wotlk 指向当前工作目录
        # 注意：在 GitHub 托管服务器上通常需要 sudo 来操作 /home 目录
        sudo ln -s ${{ github.workspace }} /home/azerothcore-wotlk
        echo "build-workspace-dir=/home/azerothcore-wotlk" >> "$GITHUB_OUTPUT"
        echo "build-output-dir=/home/azerothcore-wotlk/build" >> "$GITHUB_OUTPUT"
        # 创建 assets 目录防止后续打包报错
        mkdir -p ${{ github.workspace }}/assets

    - name: Clone All Modules
      run: |
        # 切换到 modules 目录（如果不存在则创建）
        mkdir -p ${{ github.workspace }}/modules
        cd ${{ github.workspace }}/modules

        # 定义所有模块列表 (格式：用户名/仓库名)
        REPOS="
        mod-playerbots/mod-playerbots
        azerothcore/mod-ale
        azerothcore/mod-anticheat
        azerothcore/mod-aoe-loot
        webluke/mod-grownup
        azerothcore/mod-ip-tracker
        azerothcore/mod-multi-client-check
        azerothcore/mod-pvp-titles
        pangolp/mod-recruit-friend
        azerothcore/mod-server-auto-shutdown
        azerothcore/mod-who-logged
        azerothcore/mod-transmog
        noisiver/mod-weekendbonus
        azerothcore/mod-autobalance
        azerothcore/mod-solocraft
        azerothcore/mod-solo-lfg
        azerothcore/mod-learn-spells
        azerothcore/mod-guildhouse
        azerothcore/mod-keep-out
        azerothcore/mod-gain-honor-guard
        "
        # 循环下载
        for repo in $REPOS; do
          # 自动获取斜杠后的名称作为文件夹名
          dir_name=$(echo $repo | cut -d'/' -f2)
          
          echo "------------------------------------------------------"
          echo "📡 正在快速克隆: $repo"
          
          # 使用 --depth 1 极大提高 Actions 运行速度
          git clone --depth 1 --single-branch https://github.com/$repo.git "$dir_name"
        done
        
        echo "------------------------------------------------------"
        echo "✅ 所有模块下载完成！内容如下："
        ls -l
    
    - name: Install Requirements
      run: |
        sudo apt-get update 
        sudo apt-get install -y git ninja-build cmake make gcc g++ clang libmysqlclient-dev libssl-dev libbz2-dev libreadline-dev libncurses-dev mysql-server libboost-all-dev ccache

    # 启用并优化缓存配置
    - name: Setup Cache for ccache
      uses: actions/cache@v4 # 建议使用 v4 版本
      with:
        path: ${{ github.workspace }}/.ccache
        key: ccache-${{ matrix.os }}-${{ matrix.cpp_compiler }}-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ccache-${{ matrix.os }}-${{ matrix.cpp_compiler }}-${{ github.ref }}-
          ccache-${{ matrix.os }}-${{ matrix.cpp_compiler }}-

    - name: Configure CMake
      env:
        CCACHE_DIR: ${{ github.workspace }}/.ccache
        CCACHE_MAXSIZE: "2G"
      run: >
        cmake -G Ninja -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld" \
        -DCMAKE_SHARED_LINKER_FLAGS="-fuse-ld=lld" \
        -DCMAKE_MODULE_LINKER_FLAGS="-fuse-ld=lld" \
        -S ${{ steps.strings.outputs.build-workspace-dir }}
        -DWITH_WARNINGS=1 
        -DTOOLS_BUILD=all 
        -DSCRIPTS=static 
        -DMODULES=static
        -DENABLE_CCACHE=ON
        -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        -DCMAKE_C_COMPILER_LAUNCHER=ccache
        -DCMAKE_INSTALL_PREFIX=${{ steps.strings.outputs.build-workspace-dir }}/env/dist/
        -DCMAKE_CXX_FLAGS="-fdebug-prefix-map=${{ steps.strings.outputs.build-workspace-dir }}=/home/azerothcore-wotlk"
        -DCMAKE_C_FLAGS="-fdebug-prefix-map=${{ steps.strings.outputs.build-workspace-dir }}=/home/azerothcore-wotlk"
        
    - name: Build
      env:
        CCACHE_DIR: ${{ github.workspace }}/.ccache
      run: ninja --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }} -j$(nproc)

    - name: Make install
      run: |
        cd ${{ steps.strings.outputs.build-output-dir }}
        sudo ninja install
            
    - name: Package Files BIN
      run: |
        # 进入工作区根目录
        cd ${{ steps.strings.outputs.build-workspace-dir }}
        
        # 打包时包含 env 目录
        # 这样解压后会得到一个名为 env 的文件夹，里面包含 dist 以及所有子文件夹
        tar -czvf  ${{ steps.strings.outputs.build-workspace-dir }}/assets/azerothcore-arm64-${{ matrix.os }}-${{ matrix.cpp_compiler }}-bin.tar.gz \
            env/dist

    - name: Package Files SOURCE
      run: |
        tar -czvf ${{ github.workspace }}/assets/azerothcore-arm64-${{ matrix.os }}-${{ matrix.cpp_compiler }}-source.tar.gz \
            --exclude='./build' \
            --exclude='./assets' \
            --exclude='./.ccache' \
            -C ${{ github.workspace }} .
        
    - name: Package Files
      run: |
        cd ${{ steps.strings.outputs.build-output-dir }} 
        tar -czvf ${{ github.workspace }}/assets/azerothcore-arm64-${{ matrix.os }}-${{ matrix.cpp_compiler }}-build.tar.gz \
            -C ${{ steps.strings.outputs.build-output-dir }} .

    - name: Generate Release Tag
      id: tag
      run: |
        echo "release_tag=build-$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: azerothcore-packages
        path: ${{ github.workspace }}/assets/*.tar.gz
        
    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/heads/Playerbot')
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        name: AzerothCore ARM64 Build ${{ steps.tag.outputs.release_tag }}
        files: |
          ${{ github.workspace }}/assets/*.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
