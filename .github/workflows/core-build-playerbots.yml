# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: ubuntu-build

on:
  push:
    branches: [ "Playerbot" ]
  pull_request:
    branches: [ "Playerbot" ]

jobs:
  build:
    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false
      matrix:
        # the result of the matrix will be the combination of all attributes, so we get os*compiler builds
        include:
          - os: ubuntu-24.04-arm
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Release

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}-${{ matrix.cpp_compiler }}

    steps:
    - name: Checkout AzerothCore
      uses: actions/checkout@v4

    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        # 强制创建 /home/azerothcore-wotlk 指向当前工作目录
        # 注意：在 GitHub 托管服务器上通常需要 sudo 来操作 /home 目录
        sudo ln -s ${{ github.workspace }} /home/azerothcore-wotlk
        # 验证路径
        ls /home/azerothcore-wotlk
        echo "代码现在可以通过 /home/azerothcore-wotlk 访问了"
        echo "build-workspace-dir=/home/azerothcore-wotlk" >> "$GITHUB_OUTPUT"
        echo "build-output-dir=/home/azerothcore-wotlk/build" >> "$GITHUB_OUTPUT"
        
    # - name: Clone Playerbot Module
    #   run: git clone --depth=1 --branch=master https://github.com/mod-playerbots/mod-playerbots.git modules/mod-playerbots

    - name: Checkout Playerbot Module
      uses: actions/checkout@v4
      with:
        repository: 'mod-playerbots/mod-playerbots'
        #ref: 'feature/core_update_10_2025' #used on core merge conflicts builds
        path: 'modules/mod-playerbots'
    
    - name: Clone Modules
      run: |
        cd  ${{ github.workspace }}/modules
        git clone https://github.com/azerothcore/mod-ale.git
        git clone https://github.com/azerothcore/mod-anticheat
        git clone https://github.com/azerothcore/mod-aoe-loot
        git clone https://github.com/webluke/mod-grownup
        git clone https://github.com/azerothcore/mod-ip-tracker
        git clone https://github.com/azerothcore/mod-multi-client-check
        git clone https://github.com/azerothcore/mod-pvp-titles
        git clone https://github.com/pangolp/mod-recruit-friend
        git clone https://github.com/azerothcore/mod-server-auto-shutdown
        git clone https://github.com/azerothcore/mod-who-logged
        git clone https://github.com/azerothcore/mod-transmog
        git clone https://github.com/noisiver/mod-weekendbonus
        git clone https://github.com/azerothcore/mod-autobalance
        git clone https://github.com/azerothcore/mod-solocraft
        git clone https://github.com/azerothcore/mod-solo-lfg
        git clone https://github.com/azerothcore/mod-learn-spells
        git clone https://github.com/azerothcore/mod-guildhouse
        git clone https://github.com/azerothcore/mod-keep-out
    
    - name: Install Requirements
      run: sudo apt-get update && sudo apt-get install git cmake make gcc g++ clang libmysqlclient-dev libssl-dev libbz2-dev libreadline-dev libncurses-dev mysql-server libboost-all-dev

    # - name: Cache
    #   uses: actions/cache@v3
    #   with:
    #     path: var/ccache
    #     key: ccache:${{ matrix.os }}:${{ matrix.compiler }}:${{ matrix.modules }}-modules:${{ github.ref }}:${{ github.sha }}
    #     restore-keys: |
    #       ccache:${{ matrix.os }}:${{ matrix.compiler }}:${{ matrix.modules }}-modules:${{ github.ref }}
    #       ccache:${{ matrix.os }}:${{ matrix.compiler }}:${{ matrix.modules }}-modules
            
    # - name: Configure OS
    #   run: source ./acore.sh install-deps
    #   env:
    #     CONTINUOUS_INTEGRATION: true
        
    # - name: Create conf/config.sh
    #   run: source ./apps/ci/ci-conf-core.sh
      
    # - name: Process pending sql
    #   run: bash bin/acore-db-pendings
      
    # - name: Build
    #   run: source ./apps/ci/ci-compile.sh

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ steps.strings.outputs.build-workspace-dir }}
        -DWITH_WARNINGS=1 
        -DTOOLS_BUILD=all 
        -DSCRIPTS=static 
        -DMODULES=static
        -DCMAKE_INSTALL_PREFIX= ${{ steps.strings.outputs.build-workspace-dir }}/env/dist/
        #-DCMAKE_CXX_FLAGS="-fdebug-prefix-map=${{ steps.strings.outputs.build-workspace-dir }}=/home/azerothcore-wotlk"
        #-DCMAKE_C_FLAGS="-fdebug-prefix-map==${{ steps.strings.outputs.build-workspace-dir }}=/home/azerothcore-wotlk"

    - name: Package Files SOURCE
      # 进入目录并压缩
      run: |
        cd  ${{ steps.strings.outputs.build-workspace-dir }}
        # 创建压缩包，包含时间戳以区分版本
        tar -czvf ${{ github.workspace }}/azerothcore-arm64-${{ matrix.os }}-${{ matrix.cpp_compiler }}-source.tar.gz .
        
    - name: Build
      # Build your program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    # - name: Test
    #   working-directory: ${{ steps.strings.outputs.build-output-dir }}
    #   # Execute tests defined by the CMake configuration. Note that --build-config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
    #   # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
    #   run: ctest --build-config ${{ matrix.build_type }}
    
    - name: Package Files
      # 进入目录并压缩
      run: |
        cd  ${{ steps.strings.outputs.build-output-dir }} 
        # 创建压缩包，包含时间戳以区分版本
        tar -czvf ${{ github.workspace }}/azerothcore-arm64-${{ matrix.os }}-${{ matrix.cpp_compiler }}-build.tar.gz .

    - name: Generate Release Tag
      id: tag
      run: |
        echo "release_tag=build-$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT

    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/heads/Playerbot') # 仅在 Playerbot 分支推送时触发发布
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        name: AzerothCore ARM64 Build ${{ steps.tag.outputs.release_tag }}
        draft: false
        prerelease: false
        files: |
          ${{ github.workspace }}/azerothcore-arm64-${{ matrix.os }}-${{ matrix.cpp_compiler }}-build.tar.gz
          ${{ github.workspace }}/azerothcore-arm64-${{ matrix.os }}-${{ matrix.cpp_compiler }}-source.tar.gz .
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
